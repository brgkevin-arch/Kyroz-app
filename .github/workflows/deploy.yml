name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyroz-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Filet de sécurité : rien ne se déploie si le typecheck ou les tests cassent
      # (le job `deploy` dépend de `build`). Placé AVANT l'export = échec rapide.
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm test
      - run: npx expo export -p web
        env:
          # Secrets du dépôt (P4.4, 2026-08-05). Ces deux valeurs étaient EN CLAIR
          # dans ce fichier. Ce n'était pas une fuite — la clé `anon` est publiable
          # par construction et part de toute façon dans le bundle web — mais un
          # fichier de CI n'est pas l'endroit où vit une clé : la faire tourner
          # imposait un commit, et rien ne distinguait celle-ci d'une vraie.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Expo génère la page en lang="en" (mode SPA, +html.tsx ignoré). On force le
      # français + on désactive la traduction auto, sinon les navigateurs traduisent
      # les faux-amis (« pain complet » → « douleur complète », « sèche » → « sèche-cheveux »).
      - run: |
          sed -i 's|<html lang="en">|<html lang="fr" translate="no">|' dist/index.html
          sed -i 's|<head>|<head><meta name="google" content="notranslate" />|' dist/index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kyroz-app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
