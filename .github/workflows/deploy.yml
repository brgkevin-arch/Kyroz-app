name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyroz-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Filet de sécurité : rien ne se déploie si le typecheck ou les tests cassent
      # (le job `deploy` dépend de `build`). Placé AVANT l'export = échec rapide.
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm test
      - run: npx expo export -p web
        env:
          # Secrets du dépôt (P4.4, 2026-08-05). Ces deux valeurs étaient EN CLAIR
          # dans ce fichier. Ce n'était pas une fuite — la clé `anon` est publiable
          # par construction et part de toute façon dans le bundle web — mais un
          # fichier de CI n'est pas l'endroit où vit une clé : la faire tourner
          # imposait un commit, et rien ne distinguait celle-ci d'une vraie.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Posée le 2026-08-18, une fois les trois verrous RGPD levés (IP écartée,
          # DPA signé, rétention réécrite — RGPD-REGISTRE.md). Jeton write-only,
          # public par conception : l'inliner dans le bundle web est normal.
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      # Expo génère chaque page en lang="en" (+html.tsx ignoré). On force le français
      # + on désactive la traduction auto, sinon les navigateurs traduisent les faux-amis
      # (« pain complet » → « douleur complète », « sèche » → « sèche-cheveux »).
      #
      # 🔴 CETTE ÉTAPE A MENTI EN SILENCE JUSQU'AU 2026-08-18, sur DEUX points :
      #   1. le motif cherchait `<html lang="en">` avec UNE espace — Expo en écrit DEUX
      #      (`<html  lang="en">`). Un sed qui ne trouve rien sort en 0 : la CI restait
      #      verte et la page partait en anglais, avec la seule balise meta pour garde ;
      #   2. il ne traitait que `dist/index.html`, alors que `web.output: "static"`
      #      pré-rend UNE PAGE PAR ROUTE — `legal.html`, `plan.html`… toutes en `en`.
      # ➡️ D'où le motif tolérant, le passage sur toutes les pages, et surtout la
      #    VÉRIFICATION en fin d'étape : une substitution muette ne doit plus passer.
      - name: Forcer lang="fr" + notranslate sur toutes les pages pré-rendues
        run: |
          set -euo pipefail
          pages=$(find dist -name '*.html' | wc -l)
          # Sans ce plancher, un changement de forme de `dist` viderait la boucle et
          # la vérification ci-dessous passerait au vert sans avoir rien contrôlé.
          if [ "$pages" -lt 2 ]; then
            echo "::error::seulement $pages page(s) HTML dans dist — l'export a changé de forme"
            exit 1
          fi
          # ⚠️ `sed -i` sans suffixe est du GNU : sur BSD/macOS il avale le fichier
          # suivant comme suffixe de sauvegarde. On écrit donc via un fichier temporaire,
          # forme POSIX — c'est ce qui rend cette étape REJOUABLE en local, et un
          # garde-fou qu'on ne peut pas rejouer est un garde-fou qu'on ne teste jamais.
          find dist -name '*.html' | while read -r f; do
            sed 's|<html[[:space:]]*lang="en">|<html lang="fr" translate="no">|' "$f" > "$f.tmp"
            # `public/confirme.html` porte déjà la balise : ne pas la doubler.
            if ! grep -q 'content="notranslate"' "$f.tmp"; then
              sed 's|<head>|<head><meta name="google" content="notranslate" />|' "$f.tmp" > "$f.tmp2"
              mv "$f.tmp2" "$f.tmp"
            fi
            mv "$f.tmp" "$f"
          done
          # ⚠️ ON VÉRIFIE UNE PRÉSENCE, PAS UNE ABSENCE — et c'est une correction mesurée.
          # La première version de ce contrôle cherchait s'il restait du `lang="en"` :
          # elle laissait passer `lang="en-US"` (le guillemet fermant ne suit pas), soit
          # exactement la variante de balise qui avait produit le bug d'origine. Chercher
          # ce qu'on ATTEND attrape toutes les formes que ce qu'on redoute peut prendre.
          manquantes=$(find dist -name '*.html' ! -exec grep -q '<html lang="fr" translate="no">' {} \; -print)
          if [ -n "$manquantes" ]; then
            echo "::error::pages non forcées en français — le motif ne correspond plus :"
            echo "$manquantes"
            exit 1
          fi
          echo "$pages page(s) forcée(s) en lang=\"fr\""
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kyroz-app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
