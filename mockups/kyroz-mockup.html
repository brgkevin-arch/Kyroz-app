  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ce140981-7726-40a3-90b0-9878967a3e06\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\nbody{margin:0;background:#ececef;font-family:-apple-system,\"SF Pro Text\",\"SF Pro Display\",\"Helvetica Neue\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\nbutton{font:inherit}\na{color:#1c1c1e;text-decoration:none}\na:hover{color:#0a84ff}\n@keyframes om-fade{from{opacity:0}to{opacity:1}}\n@keyframes om-up{from{transform:translateY(28px)}to{transform:translateY(0)}}\n[data-scroll]::-webkit-scrollbar{width:0}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<section id=\"t7\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(0,0,0,0.08)\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t7\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">7<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">L’onglet Recettes<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">Les quatre macros colorées deviennent une seule ligne grise sous le titre — c’est le nom du plat qu’on lit, pas les chiffres. Le filtre actif prend l’accent plein, les autres restent neutres ; « Favoris » perd son cœur, le mot suffit. Deux étiquettes maximum par recette au lieu de quatre. Le compteur de résultats se met à jour sous les filtres, comme un titre de section.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n<div id=\"7a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#7a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">7a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Recettes<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Cherche, filtre, mets en favori<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"RecettesScreen\" theme=\"clair\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"RecettesScreen\" theme=\"sombre\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Ensuite : « ajoute une photo par recette » · « <a href=\"#7a\" style=\"font-weight:600\">7a<\u002Fa> en grille à deux colonnes » · « garde les macros en couleurs ».<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t6\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(0,0,0,0.08)\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t6\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">6<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">L’onglet Profil<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">Un écran long, donc trois sections nommées plutôt qu’un défilé de blocs : le poids et la série en haut, les cibles, puis les réglages. Les quatre macros perdent leurs quatre couleurs — même graisse, même encre, la valeur porte seule. Les icônes de liste disparaissent : à 17 px semi-gras le libellé suffit, et la ligne respire. Le 🔥 de la série devient la barre de sept jours. Le rouge ne subsiste que sur la suppression de compte, comme sur iOS.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n<div id=\"6a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#6a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">6a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Profil<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Ajoute une pesée, change les préférences<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"ProfilScreen\" theme=\"clair\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"ProfilScreen\" theme=\"sombre\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Ensuite : « remets les icônes dans les listes » · « <a href=\"#6a\" style=\"font-weight:600\">6a<\u002Fa> avec la TDEE et Kyroz+ » · « le graphe de poids sur 3 mois ».<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t5\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(0,0,0,0.08)\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t5\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">5<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">L’onglet Frigo, deux segments<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">« Garde-manger » devient <strong style=\"font-weight:600\">Frigo<\u002Fstrong> — le mot de la barre d’onglets, pour qu’un même objet n’ait pas deux noms. Un segmented control iOS remplace les deux gros boutons. Dans « Mon stock », la croix de suppression disparaît de chaque ligne : toucher la quantité ouvre un pas-à-pas − / +, et tomber à zéro retire l’aliment. « À cuisiner » garde une ligne par recette avec une seule action.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n<div id=\"5a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#5a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">5a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Frigo<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Touche une quantité, bascule sur « À cuisiner »<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"FrigoScreen\" theme=\"clair\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"FrigoScreen\" theme=\"sombre\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Ensuite : « ajoute les dates de péremption » · « <a href=\"#5a\" style=\"font-weight:600\">5a<\u002Fa> avec un bandeau de recettes en haut du stock » · « garde le nom Garde-manger ».<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t4\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(0,0,0,0.08)\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t4\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">4<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">L’onglet Courses, dans la langue de <a href=\"#3a\" style=\"font-weight:600\">3a<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">Même grammaire que la synthèse : grand titre, compteur typographique, barre fine, puces d’action arrondies. Les 26 articles sont regroupés par rayon dans un bloc par section — les lignes se séparent par un filet de fond, pas par une bordure. La pastille pleine remplace la case à cocher carrée, et la quantité reste à droite en gris.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n<div id=\"4a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#4a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">4a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Courses<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Coche, masque les cochés, tout cocher d’un geste<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"CoursesScreen\" theme=\"clair\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"CoursesScreen\" theme=\"sombre\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Ensuite : « ajoute la barre de recherche » · « regroupe par repas plutôt que par rayon » · « <a href=\"#4a\" style=\"font-weight:600\">4a<\u002Fa> avec les cases à cocher à droite ».<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t3\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(0,0,0,0.08)\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t3\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">3<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">La synthèse des trois<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">L’en-tête sans carte de <a href=\"#2c\" style=\"font-weight:600\">2c<\u002Fa>, la barre de macros en nuances de <a href=\"#2a\" style=\"font-weight:600\">2a<\u002Fa>, la pastille « coché » et la densité de <a href=\"#2b\" style=\"font-weight:600\">2b<\u002Fa>. Les blocs blancs reviennent pour les repas — un par repas, jamais de liste soudée — et la pesée descend en bas, là où elle n’interrompt plus la lecture. Accent graphite par défaut : la version la plus neutre possible.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n<div id=\"3a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#3a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">3a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Synthèse<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Titre typographique, barre de macros, cartes compactes à cocher<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"PlanScreen\" idea=\"D\" theme=\"clair\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"PlanScreen\" idea=\"D\" theme=\"sombre\" accent=\"{{ acD }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Ensuite : « <a href=\"#3a\" style=\"font-weight:600\">3a<\u002Fa> avec l’anneau de <a href=\"#2b\" style=\"font-weight:600\">2b<\u002Fa> à la place de la barre » · « <a href=\"#3a\" style=\"font-weight:600\">3a<\u002Fa> en vert » · « enlève la pesée de <a href=\"#3a\" style=\"font-weight:600\">3a<\u002Fa> ».<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t2\" style=\"padding:44px 48px 40px\">\n<div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:8px\">\n<a href=\"#t2\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#1c1c1e;color:#fff;border-radius:5px\">2<\u002Fa>\n<span style=\"font:600 13px/1.2 -apple-system,system-ui;color:#1c1c1e\">Trois directions sobres, en clair et en sombre<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 26px;max-width:660px;font-size:14px;line-height:21px;color:rgba(60,60,67,0.65);text-wrap:pretty\">Même contenu, même palette neutre, un seul accent dans chaque écran. Ce qui change : la façon de dire la journée en haut, et la densité des repas. Le sombre n’est pas une inversion mécanique — fond noir pur, blocs #1C1C1E, accent éclairci pour le texte.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n\n<div id=\"2a\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#2a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">2a<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Résumé<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Chiffre + barre, macros en trois nuances de l’accent<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"PlanScreen\" idea=\"A\" theme=\"clair\" accent=\"{{ acA }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"PlanScreen\" idea=\"A\" theme=\"sombre\" accent=\"{{ acA }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"2b\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#2b\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">2b<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Anneau<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Un seul geste par repas, la journée tient dans l’écran<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"PlanScreen\" idea=\"B\" theme=\"clair\" accent=\"{{ acB }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"PlanScreen\" idea=\"B\" theme=\"sombre\" accent=\"{{ acB }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"2c\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:9px\">\n<a href=\"#2c\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,0.08);color:#1c1c1e;border-radius:5px\">2c<\u002Fa>\n<span style=\"font-size:13px;font-weight:600;color:#1c1c1e\">Notes<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(60,60,67,0.55)\">Zéro carte : le texte et le vide font la mise en page<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Clair<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#f2f2f7;box-shadow:0 30px 70px rgba(0,0,0,0.16),0 0 0 1px rgba(0,0,0,0.1)\">\n<dc-import name=\"PlanScreen\" idea=\"C\" theme=\"clair\" accent=\"{{ acC }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(60,60,67,0.45)\">Sombre<\u002Fspan>\n<div style=\"position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.4)\">\n<dc-import name=\"PlanScreen\" idea=\"C\" theme=\"sombre\" accent=\"{{ acC }}\" style=\"position:absolute;inset:0\" hint-size=\"402px,874px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:12.5px;line-height:1.6;color:rgba(60,60,67,0.5)\">Les six écrans sont vivants : change de jour, coche un repas, ouvre le menu d’un repas, ajoute un ingrédient manquant, fais défiler pour voir le grand titre se replier. Ensuite : « garde <a href=\"#2b\" style=\"font-weight:600\">2b<\u002Fa> mais avec les cartes de <a href=\"#2a\" style=\"font-weight:600\">2a<\u002Fa> » · « <a href=\"#2c\" style=\"font-weight:600\">2c<\u002Fa> en graphite partout » · « pousse encore le vide dans <a href=\"#2c\" style=\"font-weight:600\">2c<\u002Fa> ».<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;unifyAccent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Accent&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#34c759&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#34c759&quot;,&quot;#0a84ff&quot;,&quot;#ff9500&quot;,&quot;#8e8e93&quot;],&quot;section&quot;:&quot;Accent&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const picked = this.props.accent || \"\";\n    const one = this.props.unifyAccent ? (picked || \"#34c759\") : (picked && picked !== \"#34c759\" ? picked : null);\n    return {\n      acA: one || \"#34c759\",\n      acB: one || \"#ff9500\",\n      acC: one || \"#0a84ff\",\n      acD: one || \"#8e8e93\",\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
